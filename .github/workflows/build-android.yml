name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'edgedash_mobile/package-lock.json'

      - name: Setup Java (needed for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./edgedash_mobile
        run: npm ci

      - name: Generate Native Android Code (Prebuild)
        working-directory: ./edgedash_mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK (Assemble Release)
        working-directory: ./edgedash_mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgeDash-App-APK
          path: edgedash_mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
